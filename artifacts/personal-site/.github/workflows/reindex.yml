name: Reindex content

on:
  push:
    paths:
      - "blog/**"
      - "projects/**"
      - "scripts/regenerate.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate manifests + per-slug pages
        run: node scripts/regenerate.mjs

      - name: Commit regenerated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog/manifest.json projects/manifest.json '*.html' 'work/*.html'
            git commit -m "chore: reindex content"
            git push
          else
            echo "No changes to commit."
          fi
