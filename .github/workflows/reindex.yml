name: Reindex personal-site content

# Regenerates artifacts/personal-site/blog/manifest.json,
# artifacts/personal-site/projects/manifest.json, and per-slug HTML pages
# whenever a content file changes. Stdlib-only Node script — no install step.

on:
  push:
    paths:
      - "artifacts/personal-site/blog/**"
      - "artifacts/personal-site/projects/**"
      - "artifacts/personal-site/scripts/regenerate.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindex:
    # Guard against self-trigger: don't re-run when the bot just pushed the
    # regenerated manifests (defense in depth — regenerate.mjs is also
    # deterministic + write-only-on-change, so re-runs produce no diff).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/personal-site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate manifests + per-slug pages
        run: node scripts/regenerate.mjs

      - name: Commit regenerated files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog/manifest.json projects/manifest.json '*.html' 'work/*.html'
            git commit -m "chore: reindex personal-site content"
            git push
          else
            echo "No changes to commit."
          fi
