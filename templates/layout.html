<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
{{meta}}
    <link rel="preload" href="/assets/fonts/AboutBeige.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
{{styles}}
    <link rel="icon" type="image/svg+xml" href="/assets/avatar.svg" />
    <link rel="alternate" type="application/rss+xml" title="Alexander Kitov" href="/feed.xml" />
  </head>
  <body>
    <header class="ak-header">
      <div class="ak-stripe"></div>
      <nav class="ak-nav">
        <button type="button" class="ak-hamburger" aria-label="Menu" aria-expanded="false" aria-controls="ak-menu" data-menu-toggle>
          <span></span><span></span><span></span>
        </button>
        <div class="ak-nav-links">
          <a class="ak-nav-link{{active_home}}" href="/" data-nav="home">HOME</a>
          <a class="ak-nav-link{{active_work}}" href="/work/" data-nav="work">WORK</a>
          <a class="ak-nav-link{{active_about}}" href="/about/" data-nav="about">RESUMÉ</a>
        </div>
        <div class="ak-page-title" data-page-title-slot>{{section}}</div>
        <a href="/about/" class="ak-avatar" aria-label="About">
          <img src="/assets/avatar.svg" alt="Alexander Kitov" />
        </a>
      </nav>
      <nav class="ak-menu" id="ak-menu" aria-label="Main" data-menu hidden>
        <a class="ak-menu-tile{{active_home}}"{{current_home}} href="/">HOME</a>
        <a class="ak-menu-tile{{active_work}}"{{current_work}} href="/work/">WORK</a>
        <a class="ak-menu-tile{{active_about}}"{{current_about}} href="/about/">RESUMÉ</a>
      </nav>
    </header>

{{main}}

    <footer class="ak-footer">
      <div class="ak-footer-inner">
        <div class="ak-footer-name">Alexander Kitov</div>
        <div class="ak-footer-links">
          <a class="ak-footer-link" href="mailto:hello@example.com">{{icon:envelope}} Email</a>
          <a class="ak-footer-link" href="#">{{icon:linkedin-in}} LinkedIn</a>
          <a class="ak-footer-link" href="#">{{icon:twitter}} Twitter</a>
        </div>
        <div class="ak-footer-copy">© 2024</div>
      </div>
      <div class="ak-stripe"></div>
    </footer>

    <script type="module" src="/js/main.js"></script>
{{scripts}}
  </body>
</html>
